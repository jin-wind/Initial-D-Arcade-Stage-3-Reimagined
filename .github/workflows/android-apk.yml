# Builds the Android ARM64 APK (data included, no ROM) and uploads it as a
# workflow artifact. The APK (~2.5 GB) is larger than GitHub's 2 GiB release
# asset limit, so it is not attached to releases.
#
# Required repository secrets (Settings > Secrets and variables > Actions):
#   UNITY_LICENSE   contents of Unity_lic.ulf (Unity Personal) - see game.ci/docs/github/activation
#   UNITY_EMAIL     Unity account e-mail
#   UNITY_PASSWORD  Unity account password
name: Android APK

on:
  workflow_dispatch:
  push:
    branches: [android-ci]
    tags: ['android-v*']

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  UNITY_VERSION: 6000.6.4f1
  NDK_VERSION: 27.2.12479018 # NDK r27c, as used for local builds

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - name: Check Unity secrets
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          missing=""
          [ -n "$UNITY_LICENSE" ] || missing="$missing UNITY_LICENSE"
          [ -n "$UNITY_EMAIL" ] || missing="$missing UNITY_EMAIL"
          [ -n "$UNITY_PASSWORD" ] || missing="$missing UNITY_PASSWORD"
          if [ -n "$missing" ]; then echo "::error::Missing repository secrets:$missing"; exit 1; fi

      - uses: actions/checkout@v5
        with:
          fetch-depth: 1

      # The ROM is supplied by each player on first launch; it must never be
      # built into a CI artifact.
      - name: Refuse ROM files
        run: |
          found=$(find . -path ./.git -prune -o -type f \( -iname '*.chd' -o -iname '*.cue' -o -iname 'gds-0033*' \) -print)
          if [ -n "$found" ]; then echo "::error::ROM-like files in the checkout:"; echo "$found"; exit 1; fi

      - name: Install Android NDK
        run: |
          # Licenses are accepted on GitHub's hosted Android runners. Avoid a
          # yes|sdkmanager pipeline: bash pipefail treats yes's SIGPIPE as an error.
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$NDK_VERSION" > /dev/null

      - name: Build native plugin (ARM64)
        shell: pwsh
        run: "& './Tools/Build Native Android.ps1' -NdkVersion $env:NDK_VERSION -Jobs 4"

      - name: Stage game data
        shell: pwsh
        run: |
          ./Tools/Stage-GameData.ps1 -DestinationRoot Assets/StreamingAssets/IDAS3 -ManifestPath Staging/android-game-data-manifest.json
          & './Tools/Stage Android Assets.ps1'

      - name: Build APK with Unity
        uses: game-ci/unity-builder@v5.0.1
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: ${{ env.UNITY_VERSION }}
          targetPlatform: Android
          androidExportType: androidPackage
          # Runs the editor self-tests, then Idas3Build.BuildAndroidArm64,
          # which writes Builds/Android/InitialDUnity.apk.
          buildMethod: Idas3TouchControlsTests.BuildAndroid
          versioning: None
          allowDirtyBuild: true

      - name: Verify APK
        run: |
          set -o pipefail
          apk=Builds/Android/InitialDUnity.apk
          sudo chown -R "$(id -u):$(id -g)" Builds
          ls -l "$apk"
          # Re-hashes every packaged runtime file and checks 16 KB ELF alignment.
          python3 "Tools/Verify Android APK.py" "$apk" | tail -n 40

      - uses: actions/upload-artifact@v7
        with:
          name: InitialDUnity-android-${{ github.sha }}
          path: |
            Builds/Android/InitialDUnity.apk
            Builds/Android/InitialDUnity.verification.json
          compression-level: 0
          retention-days: 30
          if-no-files-found: error

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-build-logs-${{ github.sha }}
          path: |
            Logs/
            artifacts/
          retention-days: 7
          if-no-files-found: ignore
